name: Build MSI Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number for the installer (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      download_url:
        description: 'MultiMC download URL'
        required: true
        default: 'https://files.multimc.org/downloads/mmc-develop-win32.zip'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up WiX Toolset
        run: |
          # Download and install WiX Toolset
          $wixUrl = "https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311.exe"
          $wixInstaller = "$env:TEMP\wix311.exe"
          Invoke-WebRequest -Uri $wixUrl -OutFile $wixInstaller
          Start-Process -FilePath $wixInstaller -ArgumentList "/install", "/quiet" -Wait
          # Add WiX to PATH
          echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Build MSI Installer
        run: |
          # Create build directories
          New-Item -ItemType Directory -Force -Path .\build | Out-Null
          New-Item -ItemType Directory -Force -Path .\temp | Out-Null
          
          # Run the build script
          .\build-msi-full.ps1 -DownloadUrl "${{ github.event.inputs.download_url }}" -Version "${{ github.event.inputs.version }}"
        shell: pwsh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiMC-Installer-${{ github.event.inputs.version }}
          path: ./build/MultiMC-${{ github.event.inputs.version }}.msi
          retention-days: 90