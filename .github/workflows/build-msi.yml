name: Build and Release MSI Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number for the release (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      download_url:
        description: 'MultiMC download URL'
        required: true
        default: 'https://files.multimc.org/downloads/mmc-develop-win32.zip'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up WiX Toolset
        run: |
          # Download and install WiX Toolset
          $wixUrl = "https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311.exe"
          $wixInstaller = "$env:TEMP\wix311.exe"
          Invoke-WebRequest -Uri $wixUrl -OutFile $wixInstaller
          Start-Process -FilePath $wixInstaller -ArgumentList "/install", "/quiet" -Wait
          # Add WiX to PATH
          echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Build MSI Installer
        run: |
          # Create build directories
          New-Item -ItemType Directory -Force -Path .\build | Out-Null
          New-Item -ItemType Directory -Force -Path .\temp | Out-Null
          
          # Run the build script
          .\build-msi-full.ps1 -DownloadUrl "${{ github.event.inputs.download_url }}" -Version "${{ github.event.inputs.version }}"
        shell: pwsh

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.event.inputs.version }}
          release_name: MultiMC Installer v${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          body: |
            MultiMC Installer version ${{ github.event.inputs.version }}
            
            This release contains an MSI installer for MultiMC, built from:
            ${{ github.event.inputs.download_url }}
            
            ### Installation Instructions
            1. Download the MSI installer
            2. Run the installer
            3. Follow the on-screen instructions
            4. Launch MultiMC from your Start menu or desktop shortcut

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./build/MultiMC-${{ github.event.inputs.version }}.msi
          asset_name: MultiMC-${{ github.event.inputs.version }}.msi
          asset_content_type: application/x-msi